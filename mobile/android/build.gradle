// Top-level build file where you can add configuration options common to all sub-projects/modules.

def javaRuntimeVersion = Runtime.version()
def requiredJavaFeature = 21
def requiredJavaUpdate = 13

if (javaRuntimeVersion.feature() != requiredJavaFeature || javaRuntimeVersion.update() < requiredJavaUpdate) {
    throw new GradleException(
        "CosFind Android builds require JDK 21.0.13 or later in the Java 21 LTS line. " +
        "Current JDK: ${System.getProperty('java.version')}. " +
        "Update Android Studio's Gradle JDK or JAVA_HOME before building."
    )
}

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
