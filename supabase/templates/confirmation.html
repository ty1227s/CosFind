<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CosFind メールアドレスの確認</title>
  </head>
  <body style="margin:0;background:#f8f5f7;color:#30272d;font-family:'Hiragino Kaku Gothic Pro',Meiryo,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8f5f7;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #eadde4;border-radius:20px;background:#ffffff;box-shadow:0 12px 36px rgba(74,34,55,.08);">
            <tr><td style="padding:34px 34px 12px;text-align:center;"><div style="display:inline-block;border-radius:14px;background:linear-gradient(135deg,#efadd3,#d92490);color:#fff;padding:12px 18px;font-size:24px;font-weight:700;letter-spacing:.04em;">CosFind</div></td></tr>
            <tr><td style="padding:12px 34px 34px;">
              <h1 style="margin:8px 0 18px;text-align:center;font-size:23px;line-height:1.5;">メールアドレスをご確認ください</h1>
              <p style="margin:0 0 14px;font-size:15px;line-height:1.9;">CosFindへの新規登録ありがとうございます。</p>
              <p style="margin:0 0 26px;font-size:15px;line-height:1.9;">以下のボタンを押してメールアドレスを確認すると、ユーザー登録が完了します。</p>
              <p style="margin:0 0 28px;text-align:center;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:12px;background:#c72578;color:#ffffff;padding:14px 30px;text-decoration:none;font-size:16px;font-weight:700;">メールアドレスを確認する</a></p>
              <p style="margin:0 0 8px;color:#74666e;font-size:12px;line-height:1.8;">ボタンを押せない場合は、次のURLをブラウザへ貼り付けてください。</p>
              <p style="margin:0;overflow-wrap:anywhere;color:#9f245f;font-size:12px;line-height:1.7;">{{ .ConfirmationURL }}</p>
            </td></tr>
            <tr><td style="border-top:1px solid #eee4e9;padding:22px 34px;color:#83757d;font-size:12px;line-height:1.8;">このメールに心当たりがない場合は、操作せずに破棄してください。<br>CosFind運営</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
